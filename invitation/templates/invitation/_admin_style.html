{% include "approval/_style.html" %}
<style>
.inv-thumb{width:44px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#0A0A0A;display:block}
.inv-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 16px}
.inv-kpis>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.inv-kpis dt{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.inv-kpis dd{margin:4px 0 0;font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.inv-kpis .att dd{color:#0E6B45} .inv-kpis .no dd{color:#8A979D} .inv-kpis .alg dd{color:#9A4A00}
@media (max-width:760px){.inv-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.inv-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.inv-form .wide{grid-column:1/-1}
@media (max-width:760px){.inv-form{grid-template-columns:1fr}}
.inv-form label.lab{display:block;margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.inv-form input[type=text],.inv-form input[type=datetime-local]{width:100%;height:40px;padding:0 12px;font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid #CFD9DC;border-radius:8px;color-scheme:light}
.inv-form input[type=file]{width:100%;font-size:13px}
.inv-form .hint{font-size:12.5px;margin:6px 0 0}
.inv-form .slugrow{display:flex;align-items:center;border:1px solid #CFD9DC;border-radius:8px;background:#fff;overflow:hidden}
.inv-form .slugrow span{padding:0 0 0 12px;color:var(--mute);font-size:13px;white-space:nowrap}
.inv-form .slugrow input[type=text]{border:0;border-radius:0;padding-left:2px}
.inv-preview{max-width:140px;max-height:200px;border-radius:8px;border:1px solid var(--line);display:block;margin-top:8px}
.inv-preview[hidden]{display:none}
.st-open{color:#0E6B45;background:#E7F7EF;border-color:#A6E3C4}
.st-closed{color:#5B6B73;background:#F2F4F5;border-color:#D5DDE0}
.st-auto{color:#9A4A00;background:#FFF1E3;border-color:#F6CCA0}
.inv-search{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.inv-search input[type=search]{flex:1 1 240px;height:36px;padding:0 12px;font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid #CFD9DC;border-radius:8px}
.inv-head{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:start}
.inv-head img{width:96px;border-radius:8px;border:1px solid var(--line);display:block;background:#0A0A0A}
.linkrow .btn{flex:none}
.inv-resp table.pa{min-width:860px}
@media (max-width:860px){.inv-table table.pa{min-width:820px}}
.inv-table td.evname{min-width:200px}
.yes{color:#0E6B45;font-weight:600} .no{color:var(--mute)}
.edited{display:inline-block;margin-left:6px;font-size:11px;color:#9A4A00;background:#FFF1E3;border:1px solid #F6CCA0;border-radius:999px;padding:0 6px}
details.pa-card>summary{cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);list-style:none}
details.pa-card>summary::-webkit-details-marker{display:none}
details.pa-card>summary::before{content:"+ ";color:var(--accent)}
details.pa-card[open]>summary::before{content:"– "}
details.pa-card[open]>summary{margin-bottom:14px}
</style>
