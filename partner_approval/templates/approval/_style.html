<style>
/* Partner Approval (Beta) -- compact UI. base.html styles every <button> as a big
   full-width CTA; approval pages use the .btn system below instead. */
.pa-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 4px}
.pa-head h1{margin:0}
.pa-meta{color:var(--mute);font-size:13px;margin:4px 0 0}
.pa-back{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:12.5px;text-decoration:none;margin:0 0 10px}
.pa-back:hover{color:var(--ink)}
.beta{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#f3d48a;background:rgba(240,180,76,.10);border:1px solid rgba(240,180,76,.4)}

/* buttons: 36px, auto width, no glow */
button.btn,a.btn,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:auto;height:36px;margin:0;padding:0 14px;border-radius:8px;border:1px solid transparent;font:inherit;font-size:13.5px;font-weight:600;line-height:1;white-space:nowrap;text-decoration:none;cursor:pointer;box-shadow:none;transform:none;filter:none;transition:background .12s,border-color .12s,color .12s}
.btn-primary{color:#fff;background:var(--accent);border-color:var(--accent)}
.btn-primary:hover{background:#3f6cf0;filter:none}
.btn-secondary{color:var(--ink);background:#141b2e;border-color:#2c3756}
.btn-secondary:hover{background:#1a2238;border-color:#3a4870}
.btn-danger{color:#ff9d9d;background:transparent;border-color:rgba(255,107,107,.45)}
.btn-danger:hover{background:rgba(255,107,107,.10)}
.btn-danger.solid{color:#fff;background:#d14c5c;border-color:#d14c5c}
.btn-ghost{color:var(--mute);background:transparent;border-color:transparent;padding:0 10px}
.btn-ghost:hover{color:var(--ink);background:#141b2e}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn[hidden]{display:none}
.btn[disabled],.btn.busy{opacity:.55;cursor:progress}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.btns form{margin:0}
@media (max-width:860px){button.btn{padding:0 14px}}

/* cards */
.pa-card{padding:16px 18px;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.pa-card>h3,.pa-card-h h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.pa-card>h3{margin:0 0 12px}
.pa-card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.pa-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:1100px){.pa-grid{grid-template-columns:1fr}}

/* action bar */
.pa-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 14px 12px 18px;margin:16px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.pa-bar .hint{flex:1 1 260px;margin:0;font-size:12.5px}
.pa-bar .btns{flex:0 0 auto;margin-left:auto}

/* label / value */
.lv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px;margin:0}
.lv>div{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid rgba(34,43,66,.7);font-size:13.5px}
.lv>div.wide{grid-column:1/-1}
.lv dt{color:var(--mute);font-size:12.5px}
.lv dd{margin:0;color:var(--ink);overflow-wrap:anywhere;white-space:pre-line}
.lv-sub{margin:16px 0 2px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.lv-sub:first-child{margin-top:0}
@media (max-width:640px){.lv{grid-template-columns:1fr}.lv>div{grid-template-columns:112px minmax(0,1fr)}}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0;font-size:13px}
dl.kv dt{color:var(--mute)} dl.kv dd{margin:0;overflow-wrap:anywhere}

/* status badges */
.st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pending{color:#f3d48a;background:rgba(240,180,76,.08);border-color:rgba(240,180,76,.4)}
.st-approved{color:#9db8ff;background:rgba(79,124,255,.08);border-color:rgba(79,124,255,.45)}
.st-signed{color:#d3b2ff;background:rgba(160,110,255,.08);border-color:rgba(160,110,255,.45)}
.st-completed{color:#8ff0d0;background:rgba(34,211,166,.08);border-color:rgba(34,211,166,.4)}
.st-rejected{color:#ffb4b4;background:rgba(255,107,107,.08);border-color:rgba(255,107,107,.4)}
.st-resign{color:#ffcf9e;background:rgba(255,160,80,.08);border-color:rgba(255,160,80,.4)}

/* timeline */
ol.tl{list-style:none;margin:0;padding:0}
ol.tl li{position:relative;padding:0 0 14px 20px;font-size:13px}
ol.tl li::before{content:"";position:absolute;left:4px;top:6px;width:7px;height:7px;border-radius:50%;background:#3a4870}
ol.tl li::after{content:"";position:absolute;left:7px;top:16px;bottom:0;width:1px;background:var(--line)}
ol.tl li:last-child{padding-bottom:0} ol.tl li:last-child::after{display:none}
ol.tl li.chg::before{background:var(--accent)}
ol.tl .t{color:var(--ink);font-weight:600}
ol.tl .n{color:var(--ink);opacity:.86;overflow-wrap:anywhere;margin-top:2px}
ol.tl .m{color:var(--mute);font-size:11.5px;margin-top:2px}

/* tables */
.pa-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.pa-tabs a{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--line);border-radius:8px;color:var(--mute);text-decoration:none;font-size:12.5px;font-weight:600}
.pa-tabs a.on{color:var(--ink);border-color:var(--accent);background:rgba(79,124,255,.14)}
.pa-tabs a b{color:var(--ink);font-weight:700}
.pa-table{padding:0;overflow:auto}
table.pa{width:100%;border-collapse:collapse;font-size:13.5px}
table.pa th,table.pa td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.pa tr:last-child td{border-bottom:0}
table.pa th{color:var(--mute);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;background:rgba(255,255,255,.015)}
table.pa tbody tr:hover{background:rgba(79,124,255,.05)}
table.pa a{color:#9db8ff;text-decoration:none;font-weight:600}
.nowrap{white-space:nowrap}
table.pa td .sub{display:block;color:var(--mute);font-size:12px;margin-top:2px}
table.pa td.act{text-align:right;width:1%;white-space:nowrap}
table.pa .st{white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--mute);font-size:13.5px}

/* form */
.pa-form input[type=text],.pa-form input[type=email],.pa-form input[type=date],.pa-form input[type=number],.pa-form input[type=url]{width:100%;padding:10px 12px;color:var(--ink);font:inherit;font-size:14px;background:#0c1120;border:1px solid var(--line);border-radius:9px}
.pa-form input[type=date]{color-scheme:dark}
.pa-form textarea{font-family:inherit;font-size:14px;min-height:84px;padding:10px 12px;border-radius:9px}
.pa-form select{padding:10px 12px;border-radius:9px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices label{margin:0;display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#0c1120;font-size:13.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink);cursor:pointer}
.choices label:has(input:checked){border-color:var(--accent);background:rgba(79,124,255,.16)}
.req{color:#ff8f8f}
.err{color:#ffb4b4;font-size:12.5px;margin:6px 0 0}
.field[hidden]{display:none}
.pa-submit{display:flex;justify-content:flex-end;gap:8px;margin:24px 0 0;padding:16px 0 0;border-top:1px solid var(--line)}
.note{font-size:13.5px}
.pa-flash{margin:0 0 16px}

/* signing link */
.linkrow{display:flex;gap:8px;align-items:center}
.linkrow input{flex:1;min-width:0;height:36px;padding:0 10px;color:var(--ink);background:#0c1120;border:1px solid var(--line);border-radius:8px;font:12px ui-monospace,Menlo,monospace}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid var(--line);color:var(--mute)}
.pill.ok{color:#8ff0d0;border-color:rgba(34,211,166,.4)} .pill.bad{color:#ffb4b4;border-color:rgba(255,107,107,.4)}
.mini{font-size:12.5px;color:var(--mute);margin:8px 0 0;overflow-wrap:anywhere}
.mini.bad{color:#ffb4b4}
.doclist{display:flex;flex-direction:column;gap:0}
.doclist .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(34,43,66,.7);font-size:13.5px}
.doclist .row:last-child{border-bottom:0}
.doclist .row .btns{flex:none}
.preview{width:100%;height:520px;margin-top:12px;border:1px solid var(--line);border-radius:10px;background:#fff}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,6,12,.66);display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.modal .sheet{width:min(440px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid #2c3756;border-radius:12px;padding:18px 20px;box-shadow:0 24px 60px -20px #000}
.modal .sheet.wide{width:min(640px,100%)}
.modal h3{margin:0 0 6px;font-size:16px}
.modal p{margin:0 0 12px;color:var(--mute);font-size:13px}
.modal label{margin:0 0 6px;font-size:12px}
.modal textarea{min-height:88px;font-family:inherit;font-size:14px;padding:10px 12px;border-radius:9px}
.modal .btns{margin-top:14px}
.modal .lv{grid-template-columns:1fr}
.modal .lv>div{grid-template-columns:150px minmax(0,1fr);padding:6px 0}
</style>
