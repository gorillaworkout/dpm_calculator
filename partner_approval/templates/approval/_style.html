<style>
.pa-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 6px}
.beta{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#f3d48a;background:rgba(240,180,76,.10);border:1px solid rgba(240,180,76,.4)}
.pa-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
.pa-tabs a{padding:7px 12px;border:1px solid var(--line);border-radius:9px;color:var(--mute);text-decoration:none;font-size:13px;font-weight:600}
.pa-tabs a.on{color:var(--ink);border-color:var(--accent);background:rgba(79,124,255,.16)}
.pa-tabs a b{color:var(--ink);margin-left:4px}
table.pa{width:100%;border-collapse:collapse;font-size:13.5px}
table.pa th,table.pa td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.pa th{color:var(--mute);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
table.pa a{color:#9db8ff;text-decoration:none}
.st{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid}
.st-pending{color:#f3d48a;border-color:rgba(240,180,76,.45)}
.st-approved{color:#9db8ff;border-color:rgba(79,124,255,.5)}
.st-signed{color:#d3b2ff;border-color:rgba(160,110,255,.5)}
.st-completed{color:#8ff0d0;border-color:rgba(34,211,166,.45)}
.st-rejected{color:#ffb4b4;border-color:rgba(255,107,107,.45)}
.st-resign{color:#ffcf9e;border-color:rgba(255,160,80,.45)}
.pa-form input[type=text],.pa-form input[type=email],.pa-form input[type=date],.pa-form input[type=number],.pa-form input[type=url]{width:100%;padding:12px 13px;color:var(--ink);font:inherit;font-size:14px;background:#0c1120;border:1px solid var(--line);border-radius:10px}
.pa-form input[type=date]{color-scheme:dark}
.pa-form textarea{font-family:inherit;font-size:14px;min-height:84px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices label{margin:0;display:flex;align-items:center;gap:7px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#0c1120;font-size:13.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink);cursor:pointer}
.choices label:has(input:checked){border-color:var(--accent);background:rgba(79,124,255,.16)}
.req{color:#ff8f8f}
.err{color:#ffb4b4;font-size:12.5px;margin:6px 0 0}
.field[hidden]{display:none}
.pa-box{padding:18px 20px;margin:0 0 18px;background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:var(--radius)}
.pa-box h3{margin:0 0 10px;font-size:15px}
.pa-actions{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.pa-actions form{margin:0}
.pa-actions button{margin-top:10px}
.btn2{background:transparent!important;border:1px solid var(--line)!important;box-shadow:none!important;color:var(--ink)!important}
.btn-bad{background:linear-gradient(140deg,#d14c5c,#a33a6d)!important}
.linkrow{display:flex;gap:8px;align-items:center}
.linkrow input{flex:1;min-width:0;padding:10px 12px;color:var(--ink);background:#0c1120;border:1px solid var(--line);border-radius:9px;font:12.5px ui-monospace,Menlo,monospace}
.linkrow button{margin:0;width:auto;padding:10px 14px}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:13.5px}
dl.kv dt{color:var(--mute)} dl.kv dd{margin:0;overflow-wrap:anywhere}
.audit td{font-size:12.5px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,6,12,.72);display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.modal .sheet{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid #31406a;border-radius:16px;padding:22px 24px;box-shadow:0 30px 80px -20px #000}
.modal pre{max-height:55vh;color:var(--ink);font:13.5px/1.6 -apple-system,"Segoe UI",Inter,sans-serif}
.modal .row{display:flex;gap:10px}
.modal .row button{margin-top:16px}
</style>
